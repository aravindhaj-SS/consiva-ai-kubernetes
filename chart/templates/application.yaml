{{/*
  Application CRD (kubernetes-sigs/application). Google Cloud Marketplace requires every
  classic Kubernetes app to create one; it is what the Console renders as the installed app.

  spec.descriptor.version MUST match the image tags — see deploy/gcp/build-images.sh, which
  tags both the release track ("1.0") and the specific version ("1.0.0").
*/}}
apiVersion: app.k8s.io/v1beta1
kind: Application
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
  annotations:
    # Consiva shield mark, 200x200 RGBA PNG, cropped from deploy/gcp/consiva-logo.png (the wide
    # lockup there would letterbox into an illegible strip in a square slot). Regenerate from
    # that file; it is kept in the tree as the source of truth.
    kubernetes-engine.cloud.google.com/icon: >-
      data:image/png;base64,
    marketplace.cloud.google.com/deploy-info: >-
      {"partner_id": "consiva", "product_id": "consiva", "partner_name": "Swaran Soft Support Solutions Pvt Ltd"}
spec:
  descriptor:
    type: Consiva.ai
    version: "1.0.6"
    description: >-
      DPDP-compliant cookie and consent management. Runs entirely inside your own cluster —
      consent records and data-principal requests never leave your infrastructure.
    maintainers:
      - name: Swaran Soft Support Solutions Pvt Ltd
        email: support@consiva.ai
    links:
      # A user-guide link belongs here, but https://consiva.ai/docs returns 404 and Google's
      # reviewers click these. Add one back only when a real URL exists.
      - description: Support
        url: mailto:support@consiva.ai
    notes: |-
      Open the application URL and register. The first account created becomes your
      administrator, and the deployment then locks to that single organization.

      Tier: leave the Enterprise license key blank to run the Free tier. If you have agreed a
      BYOL contract with Consiva, paste the key you were issued — it is verified offline inside
      your own cluster, and the deployment reverts to Free automatically when the term ends.
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  componentKinds:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
{{- if .Values.ingress.enabled }}
    - group: networking.k8s.io
      kind: Ingress
{{- end }}
