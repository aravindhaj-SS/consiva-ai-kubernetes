{{/*
  Path routing mirrors the AWS ALB listener rules exactly:
    /api/*     -> backend   (every request path in the app already carries its own /api/v1/...)
    /sdk.js    -> backend   (the consent SDK is a static file served BY the backend from
                             wwwroot; without this rule it falls through to the frontend,
                             which has no such file, and every customer website embedding the
                             banner gets a 404)
    /sdk.min.js-> backend   (same file, minified variant)
    everything else -> frontend
  Order matters: more specific paths are declared before the catch-all.
*/}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/component: consiva-app
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.name }}-backend
                port: { number: 80 }
          - path: /sdk.js
            pathType: Exact
            backend:
              service:
                name: {{ .Values.name }}-backend
                port: { number: 80 }
          - path: /sdk.min.js
            pathType: Exact
            backend:
              service:
                name: {{ .Values.name }}-backend
                port: { number: 80 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.name }}-frontend
                port: { number: 80 }
{{- end }}
