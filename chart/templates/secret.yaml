{{/*
  Sensitive configuration. Kept in a Secret rather than the ConfigMap because these four are
  credentials in the ordinary sense: the database connection string embeds a password, the JWT
  secret signs session tokens, the SMTP password is the customer's own relay credential, and
  the licence key is a bearer token for the Enterprise tier.

  Consumed via envFrom secretRef so the container sees them under exactly the names the
  application already reads (the double underscore is ASP.NET Core's nested-config separator —
  Smtp__Password binds to "Smtp:Password"). Every name here comes from Section 3 of
  CONSIVA_CONTAINER_PRODUCT_IMPLEMENTATION_SPEC.txt; none is invented for GCP.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}-secret
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/component: consiva-config
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: {{ .Values.db.connectionString | quote }}
  Jwt__Secret: {{ .Values.jwt.secret | quote }}
  Smtp__Password: {{ .Values.smtp.password | quote }}
  # Blank is valid and means Free tier — the application logs which tier it booted as either
  # way, and an absent/invalid/expired key never blocks startup.
  EnterpriseLicenseKey: {{ .Values.enterpriseLicenseKey | default "" | quote }}
