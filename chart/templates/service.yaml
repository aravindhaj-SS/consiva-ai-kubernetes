{{/*
  Two Services so the Ingress can route by path to the right port. Both select the same Pod —
  the split is about ports, not about scheduling.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}-frontend
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/component: consiva-app
  annotations:
    # Asks GKE for container-native load balancing explicitly. GKE only auto-annotates this when
    # the cluster is VPC-native, is not on a Shared VPC, does not use GKE Network Policy and has
    # the HttpLoadBalancing add-on; Google's verification clusters fail at least one of those, so
    # the annotation has to be stated. Ignored by every non-GKE ingress controller.
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/component: consiva-app
  ports:
    - name: http-web
      port: 80
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}-backend
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/component: consiva-app
  annotations:
    # Asks GKE for container-native load balancing explicitly. GKE only auto-annotates this when
    # the cluster is VPC-native, is not on a Shared VPC, does not use GKE Network Policy and has
    # the HttpLoadBalancing add-on; Google's verification clusters fail at least one of those, so
    # the annotation has to be stated. Ignored by every non-GKE ingress controller.
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/component: consiva-app
  ports:
    - name: http-api
      port: 80
      targetPort: 5000
